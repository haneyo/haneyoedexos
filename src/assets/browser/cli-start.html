<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eDEX SEARCH</title>
<style>
  /* 中性 slate 色系:不绑定任何主题/品牌色,深底浅字,在任何 eDEX 主题下都协调(#136)。 */
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --border:#334155;
    --border-hot:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"DejaVu Sans Mono","Cascadia Mono",Menlo,monospace;
    display:flex;align-items:center;justify-content:center;
  }
  .wrap{width:min(92vw,760px)}
  h1{
    font-size:clamp(22px,5vw,40px);
    letter-spacing:.24em;
    color:var(--muted);
    font-weight:600;
    text-align:center;
    margin-bottom:30px;
  }
  form.search{display:flex;gap:10px}
  input[type=text]{
    flex:1;min-width:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font:inherit;font-size:16px;
    padding:13px 16px;
    outline:none;
    caret-color:var(--text);
  }
  input[type=text]:focus{border-color:var(--border-hot)}
  button.go{
    background:var(--border);
    border:1px solid var(--border-hot);
    border-radius:6px;
    color:var(--text);
    font:inherit;font-size:16px;
    padding:12px 22px; /* 加高:终端浏览器点击目标须 ≥2 行高(点击可靠性),browsh 亦受益 */
    cursor:pointer;
  }
  button.go:hover,button.go:focus{background:var(--border-hot)}
  .engines{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap}
  button.eng{
    background:transparent;
    border:1px solid var(--border);
    border-radius:5px;
    color:var(--muted);
    font:inherit;font-size:13px;
    letter-spacing:.06em;
    padding:7px 16px;
    cursor:pointer;
  }
  button.eng:hover,button.eng:focus{border-color:var(--border-hot);color:var(--text)}
  button.eng.on{background:var(--border);color:var(--text);border-color:var(--border-hot)}
  .hint{margin-top:24px;text-align:center;color:var(--muted);font-size:12px;opacity:.75}
</style>
</head>
<body>
  <div class="wrap">
    <h1>eDEX&nbsp;SEARCH</h1>
    <form class="search" action="#" method="get" autocomplete="off">
      <input type="text" id="q" placeholder="Search the web…" autofocus spellcheck="false">
      <button type="submit" class="go">GO</button>
    </form>
    <div class="engines" id="engines"></div>
    <div class="hint" id="hint"></div>
  </div>
<script>
  // 可更换搜索引擎:选择存 localStorage(browser profile 持久化时跨会话生效),
  // 未存时默认 DuckDuckGo(Lite 版,终端最省流)。
  var ENGINES = {
    duckduckgo:{name:"DuckDuckGo",url:"https://lite.duckduckgo.com/lite/?q="},
    google:    {name:"Google",    url:"https://www.google.com/search?q="},
    bing:      {name:"Bing",      url:"https://www.bing.com/search?q="},
    baidu:     {name:"Baidu",     url:"https://www.baidu.com/s?wd="}
  };
  var ORDER = ["duckduckgo","google","bing","baidu"];
  var KEY = "edex_cli_search_engine";

  function getEngine(){
    var e = "duckduckgo";
    try { var s = localStorage.getItem(KEY); if (s && ENGINES[s]) e = s; } catch(_) {}
    return e;
  }
  function saveEngine(e){ try { localStorage.setItem(KEY, e); } catch(_) {} }

  function render(){
    var cur = getEngine();
    var box = document.getElementById("engines");
    box.innerHTML = "";
    ORDER.forEach(function(id){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "eng" + (id === cur ? " on" : "");
      b.textContent = ENGINES[id].name;
      b.onclick = function(){
        saveEngine(id);
        render();
        document.getElementById("q").focus();
      };
      box.appendChild(b);
    });
    document.getElementById("hint").textContent =
      "searching with " + ENGINES[cur].name +
      " — Enter to search, empty box + 1-4 to switch engine";
  }

  // 终端浏览器(browsh/carbonyl)的鼠标点击派发并不可靠,但字符 keydown 是通的:
  // 搜索框为空时按 1-4 直接用数字键切换引擎,不依赖点击(UI 键盘可操作要求)。
  document.getElementById("q").addEventListener("keydown", function(ev){
    if (ev.key >= "1" && ev.key <= "4") {
      var idx = ev.key.charCodeAt(0) - 49; /* 1-4 → ORDER[0..3] */
      var cur = getEngine();
      if (document.getElementById("q").value === "" && ORDER[idx] !== cur) {
        saveEngine(ORDER[idx]);
        render();
        ev.preventDefault(); /* 不把数字打进搜索框 */
      }
    }
  });

  // file:// 源下 GET 表单提交不可靠,统一 JS 顶层跳转到所选引擎的搜索结果页。
  document.querySelector("form.search").addEventListener("submit", function(ev){
    ev.preventDefault();
    var q = document.getElementById("q").value.trim();
    if (!q) return;
    window.location.href = ENGINES[getEngine()].url + encodeURIComponent(q);
  });

  render();
</script>
</body>
</html>
