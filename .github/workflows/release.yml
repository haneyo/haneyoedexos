# Publish an eDEX-OS release. Triggered by a `v*` tag (e.g. `v2.3.0`):
#  - the `release` job builds the x64 AppImage, computes its sha256, and
#    attaches both to the GitHub Release for that tag. The in-app UpdateChecker
#    watches `releases/latest` and offers to download + verify + replace the
#    running AppImage on eDEX-OS installs.
#  - the `iso` job then remasters the stock Ubuntu Server ISO with that
#    AppImage and uploads the finished ISO (+ sha256) as a workflow artifact.
#    The ISO cannot be a Release asset: GitHub caps single assets at 2 GB and
#    the ISO is ~4.9 GB, so it is delivered as a run artifact instead.
#  - if the ALIYUN_OSS_* secrets are configured, the same ISO is also
#    mirrored to Aliyun OSS (a fast, permanent link for mainland-China
#    users). Without those secrets the step is skipped and GitHub-only
#    delivery still works.
#
#   git tag v2.3.0 && git push origin v2.3.0
#
# The tag name must match `src/package.json` version (minus the leading `v`) for
# the version comparison to work.

name: Release eDEX-OS (AppImage + ISO)

on:
  push:
    tags: ["v*"]

# The default GITHUB_TOKEN is read-only on this repo, so without this the
# release/asset step is denied ("Resource not accessible by integration").
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache npm + Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/electron
          key: ${{ runner.os }}-edex-${{ hashFiles('**/package-lock.json') }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install build deps
        run: |
          npm install
          (cd src && npm install) || (npm install-scripts approve node-pty ffmpeg-static && (cd src && npm install))

      - name: Build x64 AppImage
        run: |
          npm run prebuild-linux
          ./node_modules/.bin/electron-builder build -l --x64 --publish never
          rm -R prebuild-src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute sha256 (sibling asset for the in-app updater)
        run: |
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          echo "AppImage: $APPIMAGE"
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"
          cat "$APPIMAGE.sha256"

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build the installable ISO from the same release, so a tag always ships
  # both artifacts ("every update = AppImage + ISO").
  iso:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch AppImage from this release
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
          echo "Fetching release metadata from $API_URL"
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" > /tmp/release.json || { echo "ERROR: cannot fetch $API_URL"; exit 1; }
          ASSET=$(node -e "const j=require('/tmp/release.json');const a=(j.assets||[]).find(x=>/\.AppImage$/i.test(x.name));console.log(a?a.browser_download_url:'')")
          [ -n "$ASSET" ] || { echo "ERROR: release has no .AppImage asset"; exit 1; }
          echo "Using AppImage: $ASSET"
          curl -fL -o dist/eDEX-UI-Linux-x64.AppImage "$ASSET"
          ls -lh dist/

      - name: Download stock Ubuntu Server ISO
        run: |
          curl -fL -o /tmp/ubuntu-stock.iso "https://releases.ubuntu.com/24.04/ubuntu-24.04.3-live-server-amd64.iso"
          ls -lh /tmp/ubuntu-stock.iso

      - name: Build eDEX-OS ISO
        run: |
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          bash packaging/build-iso.sh /tmp/ubuntu-stock.iso "$APPIMAGE" \
            eDEX-OS-${{ github.ref_name }}.iso eDEX-OS

      - name: QEMU boot smoke test (best-effort)
        run: |
          sudo apt-get update -y && sudo apt-get install -y qemu-system-x86 >/dev/null 2>&1 || true
          # 240s: the runner has no KVM, so this is full software emulation.
          # The ISO's kernel cmdline carries console=ttyS0, so boot output
          # reaches -serial stdio and lands in the log.
          timeout 240 qemu-system-x86_64 -m 2G -cdrom eDEX-OS-${{ github.ref_name }}.iso -boot d \
            -serial stdio -display none > /tmp/qemu-boot.log 2>&1 || true
          if grep -qiE "grub|kernel|Booting|Ubuntu|error" /tmp/qemu-boot.log; then
            echo "QEMU boot smoke: GRUB/kernel output observed (see log)."
          else
            echo "WARNING: QEMU could not confirm boot output — install on real hardware to verify."
          fi
          tail -8 /tmp/qemu-boot.log || true

      - name: Compute ISO sha256 (for download verification)
        run: |
          sha256sum eDEX-OS-${{ github.ref_name }}.iso | tee eDEX-OS-${{ github.ref_name }}.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: eDEX-OS-ISO
          path: |
            eDEX-OS-${{ github.ref_name }}.iso
            eDEX-OS-${{ github.ref_name }}.iso.sha256
          if-no-files-found: error

      # China mirror: push the ISO (+ sha256) to Aliyun OSS so mainland users
      # get a fast, permanent link instead of a 90-day GitHub artifact. Both a
      # per-version path and a stable `latest/` path are published; the latter
      # backs the README download link. Skipped when the secrets are unset.
      - name: Publish ISO to Aliyun OSS (China mirror)
        env:
          OSS_AK_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_AK_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          set -euo pipefail
          # `secrets` cannot be read in an `if:` condition (invalid workflow),
          # so guard in shell instead: unset secrets are empty and just skip.
          if [ -z "$OSS_AK_ID" ] || [ -z "$OSS_AK_SECRET" ] || \
             [ -z "$OSS_ENDPOINT" ] || [ -z "$OSS_REGION" ] || [ -z "$OSS_BUCKET" ]; then
            echo "ALIYUN_OSS_* secrets not configured — skipping China mirror."
            exit 0
          fi
          TAG="${{ github.ref_name }}"
          ISO="eDEX-OS-$TAG.iso"

          echo "Installing ossutil 2.3.0 ..."
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil >/dev/null
          OSSUTIL=$(find /tmp/ossutil -type f -name ossutil | head -1)
          chmod +x "$OSSUTIL"
          "$OSSUTIL" --version

          AUTH=(-e "$OSS_ENDPOINT" --region "$OSS_REGION" -i "$OSS_AK_ID" -k "$OSS_AK_SECRET")
          RETRY=(--checkpoint-dir /tmp/ossutil-cp --part-size 128m)

          echo "Uploading $ISO (per-version path) ..."
          "$OSSUTIL" cp "$ISO" "oss://$OSS_BUCKET/edex-os/$TAG/" "${AUTH[@]}" "${RETRY[@]}"
          "$OSSUTIL" cp "$ISO.sha256" "oss://$OSS_BUCKET/edex-os/$TAG/" "${AUTH[@]}"

          echo "Copying to stable 'latest' path ..."
          "$OSSUTIL" cp "$ISO" "oss://$OSS_BUCKET/edex-os/latest/eDEX-OS-latest.iso" "${AUTH[@]}" "${RETRY[@]}"
          "$OSSUTIL" cp "$ISO.sha256" "oss://$OSS_BUCKET/edex-os/latest/eDEX-OS-latest.iso.sha256" "${AUTH[@]}"

          echo "China mirror ready:"
          echo "  ISO   https://$OSS_BUCKET.$OSS_ENDPOINT/edex-os/latest/eDEX-OS-latest.iso"
          echo "  SHA   https://$OSS_BUCKET.$OSS_ENDPOINT/edex-os/latest/eDEX-OS-latest.iso.sha256"
