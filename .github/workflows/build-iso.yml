# Build the eDEX-OS ISO. By default the ISO is built from the LATEST released
# eDEX-UI AppImage (GitHub Release), so what the ISO ships and what the in-app
# online updater delivers are the same version — "ISO = online update = latest".
# Building from source is available for pre-release / development work.
#
#   appimage_source:
#     - latest-release (default): take the .AppImage from the newest GitHub Release
#     - tag:                     take it from a specific release tag (the `tag` input)
#     - source:                  build the AppImage from this commit's source

name: Build eDEX-OS ISO

on:
  workflow_dispatch:
    inputs:
      ubuntu_iso:
        description: "Stock Ubuntu Server 24.04 x86_64 ISO URL to remaster"
        required: true
        default: "https://releases.ubuntu.com/24.04/ubuntu-24.04.3-live-server-amd64.iso"
      volume_label:
        description: "ISO volume label"
        required: false
        default: "eDEX-OS"
      appimage_source:
        description: "Where the eDEX AppImage comes from"
        required: false
        default: "latest-release"
        type: choice
        options:
          - latest-release
          - tag
          - source
      tag:
        description: "Release tag to take the AppImage from (used when appimage_source = tag)"
        required: false
        default: ""

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the `source` branch compiles anything; the release branches just
      # download an asset, so the npm cache is cheap to keep unconditional.
      - name: Cache npm + Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
          key: ${{ runner.os }}-edex-${{ hashFiles('**/package-lock.json') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build deps
        if: inputs.appimage_source == 'source'
        run: |
          npm install
          (cd src && npm install) || (npm install-scripts approve node-pty ffmpeg-static && (cd src && npm install))

      - name: Build eDEX AppImage (x64) from source
        if: inputs.appimage_source == 'source'
        run: |
          npm run prebuild-linux
          ./node_modules/.bin/electron-builder build -l --x64 --publish never
          rm -R prebuild-src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch AppImage from GitHub Release
        if: inputs.appimage_source != 'source'
        run: |
          mkdir -p dist
          if [ "${{ inputs.appimage_source }}" = "tag" ]; then
            [ -n "${{ inputs.tag }}" ] || { echo "ERROR: appimage_source=tag requires the 'tag' input"; exit 1; }
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}"
          else
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          fi
          echo "Fetching release metadata from $API_URL"
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: eDEX-OS-ISO" \
            "$API_URL" > /tmp/release.json || { echo "ERROR: cannot fetch $API_URL"; exit 1; }
          ASSET=$(node -e "const j=require('/tmp/release.json');const a=(j.assets||[]).find(x=>/\.AppImage$/i.test(x.name));console.log(a?a.browser_download_url:'')")
          [ -n "$ASSET" ] || { echo "ERROR: that release has no .AppImage asset"; exit 1; }
          echo "Using AppImage: $ASSET"
          curl -fL -o dist/eDEX-UI-Linux-x64.AppImage "$ASSET"
          ls -lh dist/

      - name: Download stock Ubuntu Server ISO
        run: |
          curl -fL -o /tmp/ubuntu-stock.iso "${{ github.event.inputs.ubuntu_iso }}"
          ls -lh /tmp/ubuntu-stock.iso

      - name: Build eDEX-OS ISO
        run: |
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          bash packaging/build-iso.sh /tmp/ubuntu-stock.iso "$APPIMAGE" \
            eDEX-OS-${{ github.ref_name }}.iso "${{ github.event.inputs.volume_label }}"

      - name: QEMU boot smoke test (best-effort)
        run: |
          sudo apt-get update -y && sudo apt-get install -y qemu-system-x86 >/dev/null 2>&1 || true
          timeout 90 qemu-system-x86_64 -m 2G -cdrom eDEX-OS-${{ github.ref_name }}.iso -boot d \
            -serial stdio -display none > /tmp/qemu-boot.log 2>&1 || true
          if grep -qiE "grub|kernel|Booting|Ubuntu|error" /tmp/qemu-boot.log; then
            echo "QEMU boot smoke: GRUB/kernel output observed (see log)."
          else
            echo "WARNING: QEMU could not confirm boot output — install on real hardware to verify."
          fi
          tail -5 /tmp/qemu-boot.log || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: eDEX-OS-ISO
          path: eDEX-OS-${{ github.ref_name }}.iso
          if-no-files-found: error
