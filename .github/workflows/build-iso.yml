# Build the eDEX-OS ISO. By default the ISO is built from the LATEST released
# eDEX-UI AppImage (GitHub Release), so what the ISO ships and what the in-app
# online updater delivers are the same version — "ISO = online update = latest".
# Building from source is available for pre-release / development work.
#
#   appimage_source:
#     - latest-release (default): take the .AppImage from the newest GitHub Release
#     - tag:                     take it from a specific release tag (the `tag` input)
#     - source:                  build the AppImage from this commit's source

name: Build eDEX-OS ISO

on:
  workflow_dispatch:
    inputs:
      ubuntu_iso:
        description: "Stock Ubuntu Server 24.04 x86_64 ISO URL to remaster"
        required: true
        default: "https://releases.ubuntu.com/24.04/ubuntu-24.04.3-live-server-amd64.iso"
      volume_label:
        description: "ISO volume label"
        required: false
        default: "eDEX-OS"
      appimage_source:
        description: "Where the eDEX AppImage comes from"
        required: false
        default: "latest-release"
        type: choice
        options:
          - latest-release
          - tag
          - source
      tag:
        description: "Release tag to take the AppImage from (used when appimage_source = tag)"
        required: false
        default: ""
      oss_version:
        description: "Version string for the per-version Aliyun OSS mirror path (e.g. 2.3.12-test). Empty = only update the latest/ path."
        required: false
        default: ""

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the `source` branch compiles anything; the release branches just
      # download an asset, so the npm cache is cheap to keep unconditional.
      - name: Cache npm + Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/electron
          key: ${{ runner.os }}-edex-${{ hashFiles('**/package-lock.json') }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install build deps
        if: inputs.appimage_source == 'source'
        run: |
          npm install
          (cd src && npm install) || (npm install-scripts approve node-pty ffmpeg-static && (cd src && npm install))

      - name: Build eDEX AppImage (x64) from source
        if: inputs.appimage_source == 'source'
        run: |
          npm run prebuild-linux
          ./node_modules/.bin/electron-builder build -l --x64 --publish never
          rm -R prebuild-src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch AppImage from GitHub Release
        if: inputs.appimage_source != 'source'
        run: |
          mkdir -p dist
          if [ "${{ inputs.appimage_source }}" = "tag" ]; then
            [ -n "${{ inputs.tag }}" ] || { echo "ERROR: appimage_source=tag requires the 'tag' input"; exit 1; }
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}"
          else
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          fi
          echo "Fetching release metadata from $API_URL"
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: eDEX-OS-ISO" \
            "$API_URL" > /tmp/release.json || { echo "ERROR: cannot fetch $API_URL"; exit 1; }
          ASSET=$(node -e "const j=require('/tmp/release.json');const a=(j.assets||[]).find(x=>/\.AppImage$/i.test(x.name));console.log(a?a.browser_download_url:'')")
          [ -n "$ASSET" ] || { echo "ERROR: that release has no .AppImage asset"; exit 1; }
          echo "Using AppImage: $ASSET"
          curl -fL -o dist/eDEX-UI-Linux-x64.AppImage "$ASSET"
          ls -lh dist/

      - name: Download stock Ubuntu Server ISO
        run: |
          curl -fL -o /tmp/ubuntu-stock.iso "${{ github.event.inputs.ubuntu_iso }}"
          ls -lh /tmp/ubuntu-stock.iso

      - name: Build eDEX-OS ISO
        run: |
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          bash packaging/build-iso.sh /tmp/ubuntu-stock.iso "$APPIMAGE" \
            eDEX-OS-${{ github.ref_name }}.iso "${{ github.event.inputs.volume_label }}"

      - name: QEMU boot smoke test (best-effort)
        run: |
          sudo apt-get update -y && sudo apt-get install -y qemu-system-x86 >/dev/null 2>&1 || true
          # 240s: the runner has no KVM, so this is full software emulation.
          # The ISO's kernel cmdline carries console=ttyS0, so boot output
          # reaches -serial stdio and lands in the log.
          timeout 240 qemu-system-x86_64 -m 2G -cdrom eDEX-OS-${{ github.ref_name }}.iso -boot d \
            -serial stdio -display none > /tmp/qemu-boot.log 2>&1 || true
          if grep -qiE "grub|kernel|Booting|Ubuntu|error" /tmp/qemu-boot.log; then
            echo "QEMU boot smoke: GRUB/kernel output observed (see log)."
          else
            echo "WARNING: QEMU could not confirm boot output — install on real hardware to verify."
          fi
          tail -8 /tmp/qemu-boot.log || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: eDEX-OS-ISO
          path: eDEX-OS-${{ github.ref_name }}.iso
          if-no-files-found: error

      # China mirror: push the ISO to Aliyun OSS so mainland users get a fast,
      # permanent link instead of a 90-day GitHub artifact. Mirrors the proven
      # step in release.yml (ossutil v2, -f to force overwrite). When the
      # `oss_version` input is set the ISO is also published under a
      # per-version path; `latest/` is always updated so it stays the current
      # build. Skipped when the ALIYUN_OSS_* secrets are unset.
      - name: Publish ISO to Aliyun OSS (China mirror)
        env:
          OSS_AK_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_AK_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$OSS_AK_ID" ] || [ -z "$OSS_AK_SECRET" ] || \
             [ -z "$OSS_ENDPOINT" ] || [ -z "$OSS_REGION" ] || [ -z "$OSS_BUCKET" ]; then
            echo "ALIYUN_OSS_* secrets not configured — skipping China mirror."
            exit 0
          fi
          SRC="eDEX-OS-${{ github.ref_name }}.iso"
          VER="${{ github.event.inputs.oss_version }}"
          HOST="${OSS_ENDPOINT#https://}"

          echo "Installing ossutil 2.3.0 ..."
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil >/dev/null
          OSSUTIL=$(find /tmp/ossutil -type f -name ossutil | head -1)
          chmod +x "$OSSUTIL"
          "$OSSUTIL" version

          # ossutil v2 flags only; `-f` forces overwrite (v1's interactive
          # "overwrite (y or N)?" prompt reads EOF=no under CI and would
          # silently skip the copy while exiting 0).
          AUTH=(-e "$OSS_ENDPOINT" --region "$OSS_REGION" -i "$OSS_AK_ID" -k "$OSS_AK_SECRET")

          if [ -n "$VER" ]; then
            DST="eDEX-OS-$VER.iso"
            cp "$SRC" "$DST"
            "$OSSUTIL" cp -f "$DST" "oss://$OSS_BUCKET/edex-os/$VER/" "${AUTH[@]}"
            echo "OSS PER-VERSION URL: https://$OSS_BUCKET.$HOST/edex-os/$VER/$DST"
          fi

          "$OSSUTIL" cp -f "$SRC" "oss://$OSS_BUCKET/edex-os/latest/eDEX-OS-latest.iso" "${AUTH[@]}"
          echo "OSS LATEST URL: https://$OSS_BUCKET.$HOST/edex-os/latest/eDEX-OS-latest.iso"
