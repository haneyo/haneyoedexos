# TEMPORARY: re-publish the already-built v2.2.9 ISO to the OSS mirror.
#
# The real release run (31106514428) failed ONLY in the final OSS step
# (ossutil `--version` / `--part-size` flag bugs, now fixed in release.yml),
# so the ISO artifact already exists on that run. Download it here and upload
# with the fixed command set — no 30-40 min rebuild needed.
#
# DELETE THIS FILE after the upload is verified.
name: Re-publish ISO to OSS (temporary)

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Download built ISO artifact (run 31106514428)
        uses: actions/download-artifact@v7
        with:
          name: eDEX-OS-ISO
          run-id: 31106514428

      - name: Install ossutil
        run: |
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil >/dev/null
          OSSUTIL=$(find /tmp/ossutil -type f -name ossutil | head -1)
          chmod +x "$OSSUTIL"
          "$OSSUTIL" version
          echo "OSSUTIL=$OSSUTIL" >> "$GITHUB_ENV"

      - name: Publish ISO to Aliyun OSS (per-version + latest)
        env:
          OSS_AK_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_AK_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          set -euo pipefail
          ls -lh
          TAG="v2.2.9"
          ISO="eDEX-OS-v2.2.9.iso"
          [ -f "$ISO" ] || { echo "ERROR: $ISO not found in workspace"; exit 1; }
          AUTH=(-e "$OSS_ENDPOINT" --region "$OSS_REGION" -i "$OSS_AK_ID" -k "$OSS_AK_SECRET")
          echo "Uploading $ISO (per-version path) ..."
          "$OSSUTIL" cp "$ISO" "oss://$OSS_BUCKET/edex-os/$TAG/" "${AUTH[@]}"
          "$OSSUTIL" cp "$ISO.sha256" "oss://$OSS_BUCKET/edex-os/$TAG/" "${AUTH[@]}"
          echo "Copying to stable 'latest' path ..."
          "$OSSUTIL" cp "$ISO" "oss://$OSS_BUCKET/edex-os/latest/eDEX-OS-latest.iso" "${AUTH[@]}"
          "$OSSUTIL" cp "$ISO.sha256" "oss://$OSS_BUCKET/edex-os/latest/eDEX-OS-latest.iso.sha256" "${AUTH[@]}"
          echo "Upload complete."
