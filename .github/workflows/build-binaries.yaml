name: Build packaged binaries

on: [push, pull_request, workflow_dispatch]

# Primary target is the Linux x64 AppImage (used by the eDEX-OS ISO and the
# x86_64 laptop). Electron dropped ia32 Linux builds, so only x64 is built;
# Windows / macOS builds are kept for the other platforms.
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache npm + Electron
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/electron
        key: ${{ runner.os }}-edex-${{ hashFiles('**/package-lock.json') }}
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install build deps
      run: |
        npm install
        (cd src && npm install) || (npm install-scripts approve node-pty ffmpeg-static && (cd src && npm install))
    - name: Prebuild
      run: npm run prebuild-linux
    - name: Build x64 AppImage
      run: ./node_modules/.bin/electron-builder build -l --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-AppImages
        path: dist/*.AppImage
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build-windows -- --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: dist/*.exe
        if-no-files-found: error

  build-darwin:
    runs-on: macos-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build-darwin -- --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: MacOS-Image
        path: dist/*.dmg
        if-no-files-found: error
